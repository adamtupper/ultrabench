[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultrabench"
dynamic = ["version"]
authors = [
  { name="Adam Tupper", email="adam.tupper.1@ulaval.ca" },
]
description = "A standardized benchmark of ultrasound image analysis tasks."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "datasets >= 4.0.0",
    "h5py >=3.11.0",
    "hydra-core >=1.3",
    "imageio[ffmpeg] >=0.5.1",
    "kernels>=0.16.0,<0.17.0",
    "nibabel >=5.2.1",
    "numpy >=1.26.4",
    "opencv-python-headless >=4.10.0.84",
    "openpyxl >=3.1.5",
    "pandas >=2.2.1",
    "pyyaml >=6.0.0",
    "scikit-image >=0.24.0,<0.28",
    "scikit-learn >=1.5.0",
    "simpleitk >=2.3.1",
    "transformers>=5.14.1,<6.0.0",
    "typer >=0.15.1",
    "requests >=2.32.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "nbstripout>=0.8.2",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.7",
    "seaborn>=0.13.2",
    "tbparse>=0.0.9,<0.0.10",
    "ty>=0.0.39,<0.0.40",
    "zenodo-get >=3.0.0",
    "adjusttext>=1.4.0,<2.0.0",
]
training = [
    "albumentations==2.0.0",
    "datasets==4.8.4",
    "einops==0.8.2",
    "hydra-core==1.3.2",
    "matplotlib==3.10.8",
    "pandas==3.0.0",
    "lightning==2.6.1",
    "scikit-image==0.26.0",
    "setuptools==81.0.0",
    "scikit-learn==1.8.0",
    "tensorboard==2.20.0",
    "timm==1.0.24",
    "torch==2.10.0",
    "torchmetrics==1.9.0",
    "torchvision==0.25.0",
    "tqdm==4.67.3",
    "triton>=3.3.1,<4.0.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "usaugment==1.0.1",
    "termcolor>=3.3.0,<4.0.0",
    "monai>=1.5.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/adamtupper/ultrabench"
Documentation = "https://github.com/adamtupper/ultrabench/wiki"
Issues = "https://github.com/adamtupper/ultrabench/issues"

[project.scripts]
ultrabench = "ultrabench.cli:app"

[project.entry-points."pipx.run"]
ultrabench = "ultrabench.cli:app"

[tool.hatch.version]
path = "src/ultrabench/__about__.py"

[tool.uv]
add-bounds = "major"
default-groups = ["dev"]

[tool.ty.environment]
# `notebooks/notebook_utils.py` is shared by the results notebooks and
# the tests, but lives outside the package.
extra-paths = ["notebooks"]

[tool.pytest.ini_options]
# `notebooks/notebook_utils.py` holds the run-discovery helpers the
# results notebooks share, so it is importable from the tests.
pythonpath = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["ultrabench"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.kernels.dependencies]
"kernels-community/mamba-ssm" = 1
