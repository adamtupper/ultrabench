[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultrabench"
dynamic = ["version"]
authors = [
  { name="Adam Tupper", email="adam.tupper.1@ulaval.ca" },
  { name="Ashwath Radhachandran", email="ashwathradha123@g.ucla.edu" },
]
description = "A standardized benchmark of ultrasound image analysis tasks."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "datasets >= 4.0.0",
    "huggingface-hub >=0.30",
    "hydra-core >=1.3",
    "imageio[ffmpeg] >=0.5.1",
    "numpy >=1.26.4",
    "pandas >=2.2.1",
    "pyyaml >=6.0.0",
    "scikit-image >=0.24.0,<0.28",
    "scikit-learn >=1.5.0",
    "tqdm >=4.66.0",
]

[project.optional-dependencies]
models = [
    "einops >=0.8.0,<1.0.0",
    "kernels >=0.16.0,<0.17.0",
    # Imported by the hubconf.py of the DINOv3 repository the DINOv3
    # backbones load from.
    "termcolor >=3.3.0,<4.0.0",
    "timm >=1.0.24,<2.0.0",
    "torch >=2.10.0,<3.0.0",
    "torchvision >=0.25.0,<1.0.0",
    "triton >=3.3.1,<4.0.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "ultrabench[models]",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "nbstripout>=0.8.2",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.14.7",
    "seaborn>=0.13.2",
    "tbparse>=0.0.9,<0.0.10",
    "ty>=0.0.39,<0.0.40",
    # Cross-checks the segmentation evaluator in tests/evaluate.
    "torchmetrics >=1.9.0,<2.0.0",
    "zenodo-get >=3.0.0",
    "adjusttext>=1.4.0,<2.0.0",
    # Needed only by the maintainer scripts in scripts/.
    "nibabel >=5.2.1",
    "openpyxl >=3.1.5",
    "requests >=2.32.0",
    "simpleitk >=2.3.1",
    # Not imported by the package, scripts or tests. Candidates for removal.
    "h5py >=3.11.0",
    "transformers>=5.14.1,<6.0.0",
]
examples = [
    # Dependencies of the scripts in examples/. Dependency groups are not
    # published with the package, but uv locks them together with the
    # package's dependencies, so a conflict fails `uv lock`.
    "ultrabench[models]",
]

[project.urls]
Homepage = "https://github.com/adamtupper/ultrabench"
Documentation = "https://github.com/adamtupper/ultrabench/wiki"
Issues = "https://github.com/adamtupper/ultrabench/issues"

[tool.hatch.version]
path = "src/ultrabench/__about__.py"

[tool.uv]
add-bounds = "major"
default-groups = ["dev", "examples"]

[tool.ty.environment]
# `notebooks/notebook_utils.py` is shared by the results notebooks and
# the tests, but lives outside the package.
extra-paths = ["notebooks"]

[tool.pytest.ini_options]
# `notebooks/notebook_utils.py` holds the run-discovery helpers the
# results notebooks share, so it is importable from the tests.
pythonpath = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W"]

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["ultrabench"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.kernels.dependencies]
"kernels-community/mamba-ssm" = 1
