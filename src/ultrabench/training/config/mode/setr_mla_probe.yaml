name: "setr_mla_probe"
# For isotropic ViT encoders (URFM, USFM, USF-MAE).
# Taps intermediate transformer blocks via forward hooks and fuses them with SETR-MLA.
# block_indices: null uses auto-selection (evenly-spaced last 4 blocks).
wrapper:
  _target_: ultrabench.training.methods.SegmentationWrapper
  decoder_type: "setr_mla"
  block_indices: null  # null → auto: [n//4-1, n//2-1, 3n//4-1, n-1]

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  weight_decay: 1.0e-2

criterion:
  _target_: ultrabench.training.losses.DiceCELoss
  ce_weight: 0.5
  dice_weight: 0.5
