name: "full_finetune_cls"

augmentation: "general"

wrapper:
  _target_: ultrabench.training.methods.FullFinetuningWrapper
  probe_type: "linear"

probe_warmup_epochs: 10
phase2_warmup_epochs: 5

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-2

optimizer_phase2:
  encoder_lr_scale: 0.1

# Ramps lr from start_factor*lr → lr over phase2_warmup_epochs steps.
# total_iters injected from phase2_warmup_epochs. Remove block to skip warmup.
warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 1.0e-3
  end_factor: 1.0

# T_max injected as (num_epochs - probe_warmup_epochs - phase2_warmup_epochs).
# Remove block to use constant LR after warmup.
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR

criterion:
  _target_: torch.nn.CrossEntropyLoss
  label_smoothing: 0.1

max_grad_norm: 1.0
