name: "upsampler_probe"
# For any single-feature encoder: patch_tokens (ViTs) or spatial_map (SAMUS, UltraSAM).
wrapper:
  _target_: ultrabench.training.methods.SegmentationWrapper
  decoder_type: "upsampler"
  upsampler_use_residual: true

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-2

criterion:
  _target_: ultrabench.training.losses.DiceCELoss
  ce_weight: 0.5
  dice_weight: 0.5