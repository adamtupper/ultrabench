defaults:
  - model: urfm_base
  - head: linear_classifier
  - mode: head_only
  - task: aul_mass_classification
  - _self_

data:
  setup: "ultrabench2"
  image_size: 256 # Target image size for transforms
  shot_pct: 1.0 # Single value - sweep with -m data.shot_pct=0.1,0.5,1.0
  train_val_split: 0.8 # Train/validation split ratio
  augmentation_strategy: ${mode.augmentation_strategy}

optimization:
  batch_size: 32
  accum_grad: 1
  max_steps: 10000
  unfreeze_backbone_at_step: ${mode.unfreeze_backbone_at_step}
  backbone_max_lr_ratio: 0.01
  backbone_warmup_steps: 1000
  backbone_layer_decay: 0.9
  backbone_num_layer_groups: 4
  train_bn: false
  val_check_interval: 100 # optimizer steps
  patience: 10 # validation checks
  seed: 42 # Single value - sweep with -m optimization.seed=42,43,44,45,46
  max_grad_norm: 1.0

system:
  data_loader_workers: 0
  max_parallel: 1
  data_dir: "/radraid/aradhachandran/foundation/ultrabench_data_v2"
  output_dir: "/raid/aradhachandran/thyroid/code/UltraBench2o/logs"
  checkpoint_dir: baselines
  log_every_n_steps: 50
  enable_progress_bar: true
  save_last_checkpoint: true

hydra:
  run:
    dir: ${system.output_dir}/runs/${hydra.runtime.choices.model}/${hydra.runtime.choices.task}/shot_${data.shot_pct}/seed_${optimization.seed}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${system.output_dir}/sweeps/${hydra.runtime.choices.model}/${hydra.runtime.choices.task}
    subdir: shot_${data.shot_pct}/seed_${optimization.seed}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    config:
      override_dirname:
        exclude_keys:
          - system.output_dir
          - data.shot_pct
